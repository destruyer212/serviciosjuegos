name: Publicar CodeQuest en GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - "java-puzzle-bloques-libgdx/**"
      - ".github/workflows/deploy-codequest-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: codequest-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar version web (TeaVM)
        working-directory: java-puzzle-bloques-libgdx
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: chmod +x gradlew && ./gradlew teavm:gdx_teavm_web_js_build --no-daemon

      - name: Subir carpeta webapp
        uses: actions/upload-pages-artifact@v3
        with:
          path: java-puzzle-bloques-libgdx/teavm/build/dist/web/webapp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
