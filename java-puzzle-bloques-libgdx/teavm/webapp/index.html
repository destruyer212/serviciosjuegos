<!DOCTYPE html>
<html lang="es">
    <head>
        <title>CodeQuest</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <style>
            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #020814;
            }

            body {
                display: flex;
                justify-content: center;
                align-items: center;
            }

            #canvas-wrap {
                width: 100vw;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            #canvas {
                display: block;
                border: none;
                max-width: 100vw;
                max-height: 100vh;
                width: auto;
                height: auto;
                image-rendering: auto;
            }
        </style>
    </head>
    <body oncontextmenu="return false">
        <div id="canvas-wrap">
            <canvas id="canvas"></canvas>
        </div>
        <script>
            async function start() {
                main();
            }
            window.addEventListener("load", start);
        </script>
        <script type="text/javascript" charset="utf-8" src="app.js"></script>
    </body>
</html>
